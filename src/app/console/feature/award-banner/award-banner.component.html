<div class="perch" role="status" aria-live="polite">
  @if (waiting() > 0) {
    <span class="waiting chip">{{
      'award.waiting' | translate: { count: waiting() }
    }}</span>
  }
  @for (award of stack(); track award.id) {
    <button
      type="button"
      class="award"
      [class]="award.weight"
      [class.milestone]="award.milestone"
      (click)="dismiss(award.id)"
    >
      @if (award.pieces > 0) {
        <cb-confetti [pieces]="award.pieces" />
      }
      <cb-trophy class="pokal" />
      <span class="kind chip">{{
        (award.milestone ? 'award.milestone' : 'award.achievement') | translate
      }}</span>
      <span class="label">{{ award.labelKey | translate }}</span>
      <span class="blurb">{{ award.blurbKey | translate }}</span>
      @if (award.reward; as reward) {
        <span class="reward chip">{{
          reward.key | translate: { amount: reward.amount }
        }}</span>
      }
      <span class="offscreen">{{ 'award.dismiss' | translate }}</span>
    </button>
  }
</div>
<div class="pops" aria-hidden="true">
  @for (pop of pops(); track pop.id) {
    <span
      class="pop"
      [class]="pop.weight"
      [class.sp]="pop.key === 'award.reward.sp'"
      (animationend)="popped(pop.id)"
      >{{ pop.key | translate: { amount: pop.amount } }}</span
    >
  }
</div>
