<header class="head">
  <h3>{{ 'adr.heading' | translate }}</h3>
  <span class="chip accent">{{
    'adr.progress' | translate: { tier: tier(), total: total }
  }}</span>
</header>

@if (next(); as adr) {
  <button
    type="button"
    class="record"
    [style.--cb-adr-art]="'url(' + adr.art + ')'"
    [disabled]="!adr.affordable"
    (click)="open()"
  >
    <span class="stamp">ADR-{{ adr.index }}</span>
    <span class="name">{{ adr.nameKey | translate }}</span>
    <span class="blurb">{{ adr.blurbKey | translate }}</span>
    <span class="adds">
      <span class="key">{{ 'adr.adds' | translate }}</span>
      {{ adr.ticketKey | translate }}
    </span>

    <span class="cta">
      <span class="verb">{{ 'adr.open' | translate }}</span>
      <span class="cost">{{ adr.cost }}</span>
      @if (!adr.affordable) {
        <span class="eta">{{ adr.timeToAfford }}</span>
      }
    </span>
  </button>
} @else {
  <p class="muted small whole">{{ 'adr.whole' | translate }}</p>
}
